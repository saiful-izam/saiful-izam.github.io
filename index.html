<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | &lt;nama anda&gt;</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b1020;
      --card: rgba(16, 23, 43, 0.86);
      --text: #f4f7ff;
      --muted: #9da9c4;
      --accent: #9b8cff;
      --accent-2: #52e0c0;
      --accent-soft: rgba(155, 140, 255, 0.14);
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        radial-gradient(circle at 12% 15%, rgba(155, 140, 255, 0.22), transparent 27%),
        radial-gradient(circle at 88% 85%, rgba(82, 224, 192, 0.13), transparent 28%),
        var(--background);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .profile-card {
      position: relative;
      width: min(100%, 460px);
      padding: 42px 38px 36px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(28, 37, 68, 0.9), var(--card));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
      backdrop-filter: blur(18px);
      isolation: isolate;
      transition: transform 300ms ease, box-shadow 300ms ease;
    }

    .profile-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.52), 0 0 45px rgba(155, 140, 255, 0.1);
    }

    .profile-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      top: -100px;
      right: -70px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.12;
      filter: blur(5px);
    }

    .profile-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(155, 140, 255, 0.65), transparent 38%, rgba(82, 224, 192, 0.35));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #10172b;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.08em;
      box-shadow: 0 12px 30px rgba(85, 143, 255, 0.25);
      position: relative;
    }

    .avatar::after {
      content: "";
      position: absolute;
      right: 1px;
      bottom: 3px;
      width: 15px;
      height: 15px;
      border: 3px solid #141c35;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 14px var(--accent-2);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .availability {
      width: fit-content;
      margin: 0 auto 18px;
      padding: 7px 12px;
      border: 1px solid rgba(82, 224, 192, 0.25);
      border-radius: 999px;
      background: rgba(82, 224, 192, 0.08);
      color: var(--accent-2);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.7rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .role {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 28px auto;
      border: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 18px;
    }

    .skill {
      padding: 8px 13px;
      border: 1px solid rgba(155, 140, 255, 0.2);
      border-radius: 999px;
      background: var(--accent-soft);
      color: #cbd7ff;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background 200ms ease, border-color 200ms ease, transform 200ms ease;
    }

    .skill:hover {
      transform: translateY(-2px);
      border-color: rgba(82, 224, 192, 0.5);
      background: rgba(82, 224, 192, 0.14);
    }

    .fact {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .accent-line {
      width: 100%;
      height: 1px;
      margin-top: 30px;
      background: linear-gradient(90deg, transparent, rgba(155, 140, 255, 0.45), transparent);
    }

    @media (max-width: 420px) {
      .profile-card {
        padding: 34px 22px 30px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar" aria-hidden="true">SI</div>
    <p class="availability">● Terbuka untuk peluang</p>
    <p class="eyebrow">Portfolio</p>
    <h1>Saiful Izam</h1>
    <p class="role">Developer</p>
    <hr class="divider">

    <section aria-labelledby="skills-title">
      <p class="eyebrow" id="skills-title">Kemahiran</p>
      <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
      </div>
    </section>

    <p class="fact">
      <strong>Fakta menarik</strong>
      test test test
    </p>
    <div class="accent-line" aria-hidden="true"></div>
  </main>
</body>
</html>
