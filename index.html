<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Saiful - Izam</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b1020;
      --card: rgba(19, 27, 48, 0.88);
      --text: #f4f7ff;
      --muted: #9da9c4;
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.14);
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 156, 255, 0.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(82, 211, 184, 0.1), transparent 28%),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .profile-card {
      position: relative;
      width: min(100%, 460px);
      padding: 42px 38px 36px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .profile-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      top: -100px;
      right: -70px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.12;
      filter: blur(5px);
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background: linear-gradient(135deg, #7c9cff, #56d2b8);
      color: #10172b;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.08em;
      box-shadow: 0 12px 30px rgba(85, 143, 255, 0.25);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.7rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .role {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 28px auto;
      border: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), #56d2b8);
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 18px;
    }

    .skill {
      padding: 8px 13px;
      border: 1px solid rgba(124, 156, 255, 0.2);
      border-radius: 999px;
      background: var(--accent-soft);
      color: #cbd7ff;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .fact {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      .profile-card {
        padding: 34px 22px 30px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar" aria-hidden="true">SI</div>
    <p class="eyebrow">Portfolio</p>
    <h1>Saiful Izam</h1>
    <p class="role">Developer</p>
    <hr class="divider">

    <section aria-labelledby="skills-title">
      <p class="eyebrow" id="skills-title">Kemahiran</p>
      <div class="skills">
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Docker</span>
      </div>
    </section>

    <p class="fact">
      <strong>Fakta menarik</strong>
      test test test
    </p>
  </main>
</body>
</html>
